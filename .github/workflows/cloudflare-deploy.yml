name: Cloudflare Worker CI/CD

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: leonboard-cloudflare-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Validate deploy configuration
        shell: bash
        run: |
          test -d public
          if grep -q 'REPLACE_WITH_' wrangler.jsonc; then
            echo '::error::wrangler.jsonc still contains a placeholder value.'
            exit 1
          fi

  deploy:
    name: Deploy production
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      LEONBOARD_API_URL: ${{ secrets.LEONBOARD_API_URL }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Check Cloudflare credentials
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo '::error::Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repository Actions secrets.'
            exit 1
          fi
      - name: Install dependencies
        run: npm ci
      - name: Deploy Worker
        run: npm run deploy
      - name: Smoke test deployed API
        shell: bash
        run: |
          if [[ -z "$LEONBOARD_API_URL" ]]; then
            echo '::warning::LEONBOARD_API_URL is not configured; skipping HTTP smoke test.'
            exit 0
          fi
          curl --fail --silent --show-error --retry 3 --retry-delay 2 \
            "$LEONBOARD_API_URL/api/health" > /dev/null
          echo 'LeonBoard API health check passed.'
