<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Leon Agent Project Board</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1500px;margin:auto;padding:24px}.top{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}.title h1{margin:0;font-size:30px}.title p{margin:8px 0;color:#657084}.meta{background:white;border:1px solid #e2e7f0;border-radius:14px;padding:12px 16px;box-shadow:0 6px 22px rgba(40,56,90,.06)}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.filters button{border:1px solid #d8dfeb;background:white;border-radius:999px;padding:8px 12px;cursor:pointer}.filters button.active{background:#172033;color:white}.board{display:grid;grid-template-columns:repeat(4,minmax(260px,1fr));gap:14px;align-items:start}.col{background:#edf1f7;border-radius:16px;padding:12px;min-height:180px}.col h2{font-size:15px;margin:2px 4px 12px;display:flex;justify-content:space-between}.count{font-weight:500;color:#6e788a}.card{background:white;border:1px solid #dde4ef;border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 4px 14px rgba(30,48,80,.05)}.row{display:flex;justify-content:space-between;gap:12px}.card h3{font-size:16px;margin:0 0 8px}.tag{font-size:11px;border-radius:999px;padding:4px 8px;background:#eef3ff;white-space:nowrap}.p0{background:#ffe7e7}.p1{background:#fff2d8}.p2{background:#e8f2ff}.p3{background:#eef1f5}.small{font-size:12px;color:#6a7484;line-height:1.45}.next{margin-top:10px;font-size:13px;line-height:1.45}.repo{margin-top:10px;font-size:12px}.repo a{color:#215bb5;text-decoration:none}.empty{font-size:13px;color:#8a93a2;padding:8px}.legend{margin-top:18px;font-size:12px;color:#697487}.progress{height:7px;background:#edf0f5;border-radius:999px;overflow:hidden;margin:10px 0 5px}.progress i{display:block;height:100%;background:#2f6fea}.source{font-size:11px;color:#8a93a2}@media(max-width:1200px){.board{grid-template-columns:repeat(2,minmax(260px,1fr))}}@media(max-width:680px){.wrap{padding:14px}.board{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="title"><h1>Leon Agent Project Board</h1><p>ChatGPT × OpenCode × Google AI 共用專案進度控制台</p></div>
    <div class="meta" id="meta">載入中…</div>
  </div>
  <div class="filters" id="filters"></div>
  <div class="board" id="board"></div>
  <div class="legend">GitHub registry / PROJECT_COMPACT.md 是權威來源；D1 只做 Dashboard、Agent Activity、Handoff 與查詢快取。</div>
</div>
<script>
const groups=[
  {key:'idea',label:'Idea / Planned',statuses:['idea','planned']},
  {key:'active',label:'Active',statuses:['active']},
  {key:'verify',label:'Waiting / Verification',statuses:['waiting','verification']},
  {key:'migration',label:'Migration / Done',statuses:['migration','done','paused']}
];
let data={projects:[],updatedAt:'-',updatedBy:'-'};let typeFilter='all';let source='';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){
 document.getElementById('meta').innerHTML=`<b>${data.projects.length}</b> projects<br><span class="small">Updated ${esc(data.updatedAt||'-')} by ${esc(data.updatedBy||'-')}</span><br><span class="source">Source: ${esc(source)}</span>`;
 const types=['all',...new Set(data.projects.map(p=>p.type).filter(Boolean))];
 document.getElementById('filters').innerHTML=types.map(t=>`<button class="${t===typeFilter?'active':''}" data-t="${esc(t)}">${t==='all'?'全部':esc(t)}</button>`).join('');
 document.querySelectorAll('#filters button').forEach(b=>b.onclick=()=>{typeFilter=b.dataset.t;render()});
 const list=data.projects.filter(p=>typeFilter==='all'||p.type===typeFilter);
 document.getElementById('board').innerHTML=groups.map(g=>{
   const items=list.filter(p=>g.statuses.includes(p.status));
   return `<section class="col"><h2>${g.label}<span class="count">${items.length}</span></h2>${items.length?items.map(card).join(''):'<div class="empty">目前沒有專案</div>'}</section>`;
 }).join('');
}
function card(p){
 const repo=p.repo?`<div class="repo"><a target="_blank" href="https://github.com/${encodeURI(p.repo)}">${esc(p.repo)}</a></div>`:'';
 const progress=Number.isFinite(Number(p.progress))?Math.max(0,Math.min(100,Number(p.progress))):0;
 return `<article class="card"><div class="row"><h3>${esc(p.name)}</h3><span class="tag ${String(p.priority).toLowerCase()}">${esc(p.priority)}</span></div><div class="small">${esc(p.status)} · ${esc(p.type||'development')} ${p.platform?'· '+esc(p.platform):''}</div><div class="progress"><i style="width:${progress}%"></i></div><div class="small">${progress}% · Primary: ${esc(p.primaryAgent||p.primary_agent||'-')}</div><div class="next"><b>Next:</b> ${esc(p.nextAction||p.next_action||'-')}</div>${repo}</article>`;
}
async function load(){
 try{
   const r=await fetch('/api/projects',{cache:'no-store'});
   if(!r.ok)throw new Error('api');
   const projects=await r.json();
   data={projects,updatedAt:new Date().toISOString(),updatedBy:'D1 cache'};source='D1 API';render();return;
 }catch(_){ }
 try{
   const r=await fetch('./projects.json',{cache:'no-store'});if(!r.ok)throw new Error(r.status);
   data=await r.json();source='GitHub projects.json';render();
 }catch(e){
   document.getElementById('meta').textContent='資料載入失敗';
   document.getElementById('board').innerHTML='<div class="card">請確認 Worker/D1 或 projects.json 可讀取。</div>';
 }
}
load();
</script>
</body>
</html>
