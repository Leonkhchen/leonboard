name: Sync Portfolio to LeonBoard

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sync GitHub state to LeonBoard D1
        env:
          LEONBOARD_API_URL: ${{ secrets.LEONBOARD_API_URL }}
          LEONBOARD_SYNC_TOKEN: ${{ secrets.LEONBOARD_SYNC_TOKEN }}
          LEONBOARD_GITHUB_TOKEN: ${{ secrets.LEONBOARD_GITHUB_TOKEN }}
        run: node scripts/sync-github.mjs
